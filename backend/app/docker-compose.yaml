services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: velox
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d velox"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - velox-network
  app:
    build: .
    restart: always
    command: npm run dev
    ports:
      - 8080:5001
    networks:
      - velox-network
    volumes:
      - .:/app
      - /app/node_modules
      - ./application_default_credentials.json:/app/application_default_credentials.json
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/application_default_credentials.json
      - DB_HOST=db
      - DB_NAME=velox
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - SANDBOX_PROVIDER=${SANDBOX_PROVIDER:-local}
      - LOCAL_SANDBOX_URL=${LOCAL_SANDBOX_URL:-http://localhost:9000}
      - LOCAL_SANDBOX_TOKEN=${SANDBOX_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

networks:
  velox-network:
    external: true
